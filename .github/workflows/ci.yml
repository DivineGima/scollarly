name: CI

# S0.1 minimal CI. Runs on every merge request, and on `main` after a merge. A branch with an open merge request is checked once, by the
# merge request (it used to run twice, on the push and on the merge request, which used up the free Actions minutes). A change that touches
# only the tracker or docs/ skips it. Deploys are NOT done here (architecture 13.3: deploys run only from `main` after merge).
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ["tracker/**", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the import boundaries, the every-table row level security scan, the 9.5 permission table parity check,
      # the security headers and the i18n catalogues.
      - run: npm test
      # S1.1: the migrations folder must match src/server/db/schema.ts. If generate has anything to write, the schema changed
      # without a migration, and this step fails.
      - name: Migrations match the schema
        run: |
          MIGRATION_DATABASE_URL=postgres://ci:ci@localhost/ci npx drizzle-kit generate --name ci_drift_check
          test -z "$(git status --porcelain src/server/db/migrations)" || { git status --porcelain src/server/db/migrations; echo "Schema changed without a migration."; exit 1; }

  integration:
    name: Integration tests (Postgres service container)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: scollarly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/scollarly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      # Applies every migration to an empty database, then runs the constraint, row level security, authorisation matrix,
      # repository and seed suites (S1.1 to S1.7).
      - run: npm run test:integration

  build:
    name: Build and Worker size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build:worker
      # Fails above 2.6 MiB compressed (architecture 12, section 17).
      - run: npm run size

  e2e:
    name: Playwright (offline mode)
    runs-on: ubuntu-latest
    # Two shards run side by side, so the browser tests take about 3 minutes instead of 5. Each shard builds the site once.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      # The build cache lets each shard skip the compile work that did not change (about a minute saved).
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # The runner image already carries the system libraries Chromium needs; `--with-deps` only ran a slow `apt-get update` (once 6 minutes), so
      # only the browser is fetched, and it is cached by Playwright version. If a library were ever missing, Chromium fails to start and says which.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
      # Offline mode (S0.8), plus axe, the security headers with the CSP enforced, 375 px layout and the /en rewrite (S1.5, S1.6).
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: "playwright-report-${{ matrix.shard }}", path: playwright-report, retention-days: 7 }

  lighthouse:
    name: Lighthouse CI (mobile budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The mobile budget takes about 10 minutes, so a pull request runs it only when it touches something a public page is made of. Every merge to
      # `main` runs it in full, so the budget is still checked on everything that ships.
      - name: Does this change touch the public site?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          if echo "$changed" | grep -qE '^(src/app/\[locale\]/\(public\)|src/app/layout|src/components/(public|shell|auth)|src/modules/content/|src/lib/|src/i18n/|messages/|public/|next\.config|package(-lock)?\.json|lighthouserc|scripts/check-public-bundle)|\.css$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No public page changed: the Lighthouse budget is checked again when this merges to main."
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - if: steps.scope.outputs.run == 'true'
        run: npm ci
      - if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # The site is built from the test content snapshot, so every public page has content to measure (src/modules/content/fixture.ts).
      - if: steps.scope.outputs.run == 'true'
        run: npx next build
        env:
          CONTENT_FIXTURE_FILE: tests/fixtures/content-snapshot.json
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # First-load JavaScript of every public route, and no admin library in any of them (S3.5).
      - if: steps.scope.outputs.run == 'true'
        run: npm run check:bundle
      # A pull request measures six key pages once (about a minute); `main` measures every public page once. One run is enough because the
      # score has a wide margin over the 0.85 floor and the byte budget does not vary between runs. The server is started here and every page is
      # fetched once before the first measurement: the first request after a start is slow (it loads the page code), and a cold first page used to
      # fail the budget (0.76 on `/`, then 0.78 on the light `/offline` page) although nothing was wrong with the page.
      - if: steps.scope.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          npx next start -p 3101 > next-start.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3101/api/v1/health > /dev/null && break; sleep 1; done
          for page in $(node -e 'for (const f of ["lighthouserc.json", "lighthouserc.pr.json"]) for (const u of require("./" + f).ci.collect.url) console.log(new URL(u).pathname)' | sort -u); do curl -s -o /dev/null "http://localhost:3101$page"; done
          if [ "$EVENT" = "pull_request" ]; then npx lhci autorun --config=lighthouserc.pr.json; else npx lhci autorun; fi
