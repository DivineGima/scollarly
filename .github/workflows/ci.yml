name: CI

# S0.1 minimal CI. Runs on every push and merge request. Deploys are NOT done here (architecture 13.3:
# deploys run only from `main` after merge, and no deploy workflow exists in Stage 0).
on:
  push:
    branches-ignore: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the import boundaries, the every-table row level security scan, the 9.5 permission table parity check,
      # the security headers and the i18n catalogues.
      - run: npm test
      # S1.1: the migrations folder must match src/server/db/schema.ts. If generate has anything to write, the schema changed
      # without a migration, and this step fails.
      - name: Migrations match the schema
        run: |
          MIGRATION_DATABASE_URL=postgres://ci:ci@localhost/ci npx drizzle-kit generate --name ci_drift_check
          test -z "$(git status --porcelain src/server/db/migrations)" || { git status --porcelain src/server/db/migrations; echo "Schema changed without a migration."; exit 1; }

  integration:
    name: Integration tests (Postgres service container)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: scollarly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/scollarly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      # Applies every migration to an empty database, then runs the constraint, row level security, authorisation matrix,
      # repository and seed suites (S1.1 to S1.7).
      - run: npm run test:integration

  build:
    name: Build and Worker size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run build:worker
      # Fails above 2.6 MiB compressed (architecture 12, section 17).
      - run: npm run size

  e2e:
    name: Playwright (offline mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Offline mode (S0.8), plus axe, the security headers with CSP in report-only mode, 375 px layout and the /en rewrite (S1.5, S1.6).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  lighthouse:
    name: Lighthouse CI (mobile budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      # The site is built from the test content snapshot, so every public page has content to measure (src/modules/content/fixture.ts).
      - run: npx next build
        env:
          CONTENT_FIXTURE_FILE: tests/fixtures/content-snapshot.json
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      # First-load JavaScript of every public route, and no admin library in any of them (S3.5).
      - run: npm run check:bundle
      - run: npx lhci autorun
