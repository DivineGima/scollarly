name: Apply the campus tour seed

# Manual only, and only from `main`. Adds the verified campus tour videos and their preview pictures (S14.6) to the live database, then
# archives the earlier placeholder tour videos of the same universities. Both steps are safe to run twice (rows have fixed ids and are
# inserted with ON CONFLICT DO NOTHING; a picture is identified by its content hash). Nothing is deleted.
#
# Secrets used: PHASE0_MIGRATION_DATABASE_URL, PHASE0_NEON_STORAGE_ENDPOINT, PHASE0_NEON_STORAGE_REGION,
# PHASE0_NEON_STORAGE_ACCESS_KEY_ID, PHASE0_NEON_STORAGE_SECRET_ACCESS_KEY.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-content
  cancel-in-progress: false

jobs:
  seed-tours:
    name: Seed the campus tours
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.PHASE0_MIGRATION_DATABASE_URL }}
      NEON_STORAGE_ENDPOINT: ${{ secrets.PHASE0_NEON_STORAGE_ENDPOINT }}
      NEON_STORAGE_REGION: ${{ secrets.PHASE0_NEON_STORAGE_REGION }}
      NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.PHASE0_NEON_STORAGE_ACCESS_KEY_ID }}
      NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.PHASE0_NEON_STORAGE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Check the seed files and pictures
        run: npx tsx scripts/seed.ts --dir data/seed --tours-only --dry-run
      - name: Add the tour rows and preview pictures
        run: npx tsx scripts/seed.ts --dir data/seed --tours-only
      - name: Archive the earlier placeholder tour videos
        run: node scripts/ops/archive-old-tours.mjs
