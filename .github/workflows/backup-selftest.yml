name: Backup self-test

# S10.3: proves, on a throwaway database and a throwaway key, that the weekly dump can be restored and that a failed dump fails the job.
# Runs when the backup scripts or workflows change, and on request. It never touches production and uses no secret.
on:
  pull_request:
    paths:
      - "scripts/ops/**"
      - ".github/workflows/backup*.yml"
      - "src/server/db/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roundtrip:
    name: Dump, encrypt, restore, compare
    runs-on: ubuntu-latest
    services:
      postgres:
        # The same major version the dump tools below are installed at, so the restore reads exactly what the dump wrote.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Install age and the PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y age postgresql-client-18
          # The runner ships PostgreSQL 16 tools first on the path; Neon runs PostgreSQL 18 and pg_dump refuses a newer server, so the dump needs the 18 tools.
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
          pg_dump --version
          age --version
      - run: bash scripts/ops/backup-selftest.sh
