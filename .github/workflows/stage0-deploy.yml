name: Stage 0 deploy and measure

# Manual only. Builds on Linux (OpenNext does not build reliably on Windows), deploys the Stage 0 slice to the
# free workers.dev address, then runs the CPU measurement from architecture section 17 (the Stage 0 functional probes were removed once Stage 0 closed).
# Deploys run only from `main` after merge (architecture 13.3). Nothing here runs on a push or a pull request.
#
# Secrets used (repository secrets): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PHASE0_DATABASE_URL (owner, pooled),
# PHASE0_MIGRATION_DATABASE_URL (owner, direct), PHASE0_RUNTIME_DB_PASSWORD (password of the non-owner app_runtime role),
# PHASE0_NEON_AUTH_BASE_URL, PHASE0_NEON_AUTH_COOKIE_SECRET, PHASE0_TOTP_ENCRYPTION_KEY, PHASE0_RATE_LIMIT_SECRET,
# PHASE0_NEON_STORAGE_ENDPOINT, PHASE0_NEON_STORAGE_REGION, PHASE0_NEON_STORAGE_ACCESS_KEY_ID, PHASE0_NEON_STORAGE_SECRET_ACCESS_KEY,
# PHASE0_PROBE_TOKEN, PHASE0_OWNER_EMAIL.
# The Worker connects as app_runtime, never as the owner (ADR-038). Throwaway probe sessions are created and always removed.
on:
  workflow_dispatch:
    inputs:
      run_cpu_measurement:
        description: "Run the CPU measurement after the probes (adds about 15 minutes)"
        required: false
        default: true
        type: boolean
      cpu_scenarios:
        description: "Only these CPU scenarios, comma separated (for example: lead). Empty runs all of them"
        required: false
        default: ""
        type: string
      lead_samples:
        description: "Lead requests to measure, sent 12.5 seconds apart (50 takes about 10 minutes)"
        required: false
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: stage0-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  WORKER_NAME: scollarly

jobs:
  deploy-and-measure:
    name: Deploy to workers.dev and measure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci

      - name: Check the Cloudflare token and all repository secrets exist
        env:
          HAVE_DB: ${{ secrets.PHASE0_DATABASE_URL != '' }}
          HAVE_MIGRATION_DB: ${{ secrets.PHASE0_MIGRATION_DATABASE_URL != '' }}
          HAVE_RUNTIME_PW: ${{ secrets.PHASE0_RUNTIME_DB_PASSWORD != '' }}
          HAVE_AUTH_URL: ${{ secrets.PHASE0_NEON_AUTH_BASE_URL != '' }}
          HAVE_COOKIE_SECRET: ${{ secrets.PHASE0_NEON_AUTH_COOKIE_SECRET != '' }}
          HAVE_TOTP_KEY: ${{ secrets.PHASE0_TOTP_ENCRYPTION_KEY != '' }}
          HAVE_RATE_SECRET: ${{ secrets.PHASE0_RATE_LIMIT_SECRET != '' }}
          HAVE_STORAGE_ENDPOINT: ${{ secrets.PHASE0_NEON_STORAGE_ENDPOINT != '' }}
          HAVE_STORAGE_REGION: ${{ secrets.PHASE0_NEON_STORAGE_REGION != '' }}
          HAVE_STORAGE_KEY_ID: ${{ secrets.PHASE0_NEON_STORAGE_ACCESS_KEY_ID != '' }}
          HAVE_STORAGE_SECRET: ${{ secrets.PHASE0_NEON_STORAGE_SECRET_ACCESS_KEY != '' }}
          HAVE_PROBE_TOKEN: ${{ secrets.PHASE0_PROBE_TOKEN != '' }}
          HAVE_OWNER_EMAIL: ${{ secrets.PHASE0_OWNER_EMAIL != '' }}
        run: |
          missing=0
          for name in HAVE_DB HAVE_MIGRATION_DB HAVE_RUNTIME_PW HAVE_AUTH_URL HAVE_COOKIE_SECRET HAVE_TOTP_KEY HAVE_RATE_SECRET HAVE_STORAGE_ENDPOINT HAVE_STORAGE_REGION HAVE_STORAGE_KEY_ID HAVE_STORAGE_SECRET HAVE_PROBE_TOKEN HAVE_OWNER_EMAIL; do
            if [ "${!name}" != "true" ]; then echo "::error::A required PHASE0_* secret is missing ($name)"; missing=1; fi
          done
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing"; missing=1; fi
          [ "$missing" = "0" ] || exit 1
          status=$(curl -s -o /tmp/verify.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "Token verify HTTP status: $status"
          node -e 'const j=JSON.parse(require("fs").readFileSync("/tmp/verify.json","utf8")); console.log("token status:", j.result && j.result.status); process.exit(j.success && j.result && j.result.status==="active" ? 0 : 1)' \
            || { echo "::error::The Cloudflare API token is not active. Recreate it (guide Part B) and update the secret."; exit 1; }

      - name: Find or create the KV namespace and D1 database
        id: provision
        run: node scripts/ci/provision-cloudflare.mjs

      - name: Find the workers.dev address
        id: url
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" > /tmp/sub.json
          node -e '
            const j = JSON.parse(require("fs").readFileSync("/tmp/sub.json","utf8"));
            const sub = j.result && j.result.subdomain;
            if (!sub) { console.error("::error::This account has no workers.dev subdomain. Open Cloudflare, Workers and Pages, and register one once."); process.exit(1); }
            const url = "https://" + process.env.WORKER_NAME + "." + sub + ".workers.dev";
            console.log("Worker address: " + url);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "url=" + url + "\n");
          '

      - name: Apply database migrations to Neon (direct connection)
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.PHASE0_MIGRATION_DATABASE_URL }}
        run: npm run db:migrate

      - name: Set the password of the non-owner runtime role and build the Worker's connection string
        id: runtime
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.PHASE0_MIGRATION_DATABASE_URL }}
          POOLED_DATABASE_URL: ${{ secrets.PHASE0_DATABASE_URL }}
          RUNTIME_DB_PASSWORD: ${{ secrets.PHASE0_RUNTIME_DB_PASSWORD }}
        run: node scripts/ci/ensure-runtime-role.mjs

      - name: Store 10 test images (about 300 KB each) in Neon Object Storage
        id: seed
        env:
          DATABASE_URL: ${{ secrets.PHASE0_MIGRATION_DATABASE_URL }}
          NEON_STORAGE_ENDPOINT: ${{ secrets.PHASE0_NEON_STORAGE_ENDPOINT }}
          NEON_STORAGE_REGION: ${{ secrets.PHASE0_NEON_STORAGE_REGION }}
          NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.PHASE0_NEON_STORAGE_ACCESS_KEY_ID }}
          NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.PHASE0_NEON_STORAGE_SECRET_ACCESS_KEY }}
        run: |
          npm run phase0:seed-image -- --count 10
          echo "sha=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("scripts/.generated/phase0-images.json","utf8")).shas[0])')" >> "$GITHUB_OUTPUT"

      - name: Create throwaway Neon Auth sessions for an admin and a student (removed again at the end)
        env:
          DATABASE_URL: ${{ secrets.PHASE0_MIGRATION_DATABASE_URL }}
        run: node scripts/ci/seed-probe-sessions.mjs

      - name: Build the Worker
        env:
          # Public by design (it is in the page). Cloudflare's documented always-pass test site key until the owner adds a real
          # widget as the repository secret TURNSTILE_SITE_KEY (docs/stage-4-runbook.md).
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY != '' && secrets.TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
          # The build reads the published content once (prerender) as the non-owner runtime role (ADR-038).
          DATABASE_URL: ${{ steps.runtime.outputs.runtime_url }}
        run: npx opennextjs-cloudflare build

      - name: Worker size gate (at most 2.6 MiB compressed)
        run: npm run size

      - name: Deploy to Cloudflare (also fills the OpenNext cache stores)
        run: npx opennextjs-cloudflare deploy

      - name: Set the Worker secrets
        env:
          DATABASE_URL: ${{ steps.runtime.outputs.runtime_url }}
          NEON_AUTH_BASE_URL: ${{ secrets.PHASE0_NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.PHASE0_NEON_AUTH_COOKIE_SECRET }}
          TOTP_ENCRYPTION_KEY: ${{ secrets.PHASE0_TOTP_ENCRYPTION_KEY }}
          RATE_LIMIT_SECRET: ${{ secrets.PHASE0_RATE_LIMIT_SECRET }}
          NEON_STORAGE_ENDPOINT: ${{ secrets.PHASE0_NEON_STORAGE_ENDPOINT }}
          NEON_STORAGE_REGION: ${{ secrets.PHASE0_NEON_STORAGE_REGION }}
          NEON_STORAGE_ACCESS_KEY_ID: ${{ secrets.PHASE0_NEON_STORAGE_ACCESS_KEY_ID }}
          NEON_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.PHASE0_NEON_STORAGE_SECRET_ACCESS_KEY }}
          OWNER_EMAIL: ${{ secrets.PHASE0_OWNER_EMAIL }}
          PHASE0_PROBE_TOKEN: ${{ secrets.PHASE0_PROBE_TOKEN }}
          REAL_TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          node -e '
            const names = ["DATABASE_URL","NEON_AUTH_BASE_URL","NEON_AUTH_COOKIE_SECRET","TOTP_ENCRYPTION_KEY","RATE_LIMIT_SECRET","NEON_STORAGE_ENDPOINT","NEON_STORAGE_REGION","NEON_STORAGE_ACCESS_KEY_ID","NEON_STORAGE_SECRET_ACCESS_KEY","OWNER_EMAIL","PHASE0_PROBE_TOKEN"];
            const out = {};
            for (const n of names) { if (!process.env[n]) { console.error("::error::" + n + " is empty"); process.exit(1); } out[n] = process.env[n]; }
            // The real Turnstile secret is set from the first deploy, and stays. The CPU measurement does not need a weaker secret: it sends
            // the measurement header, which the Worker accepts only with PHASE0_PROBE_TOKEN (src/server/security/measurement.ts).
            // Until the owner adds the widget secret (docs/stage-4-runbook.md), the always-pass test secret documented by Cloudflare is used and
            // the lead form is NOT protected from scripts: the warning below says so on every run.
            if (process.env.REAL_TURNSTILE_SECRET) {
              out.TURNSTILE_SECRET_KEY = process.env.REAL_TURNSTILE_SECRET;
            } else {
              console.log("::warning::TURNSTILE_SECRET_KEY repository secret is missing. The always-pass test secret is on the Worker, so the lead form accepts any token. Add the real widget secret before launch.");
              out.TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA";
            }
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
          '
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      - name: Wait until the Worker answers
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.url.outputs.url }}/api/v1/health" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::The Worker did not answer 200 at /api/v1/health"; exit 1

      - name: CPU measurement (needs a fresh rate-limit window first)
        if: ${{ inputs.run_cpu_measurement }}
        continue-on-error: true
        env:
          PHASE0_PROBE_TOKEN: ${{ secrets.PHASE0_PROBE_TOKEN }}
          CPU_SCENARIOS: ${{ inputs.cpu_scenarios }}
          LEAD_SAMPLES: ${{ inputs.lead_samples }}
        run: |
          sleep 70
          node scripts/measure-cpu.mjs ${CPU_SCENARIOS:+--only "$CPU_SCENARIOS"} --lead-samples "${LEAD_SAMPLES:-50}" --base "${{ steps.url.outputs.url }}" --worker "$WORKER_NAME" --samples 50 --media "${{ steps.seed.outputs.sha }}" --media-list scripts/.generated/phase0-images.json --sessions scripts/.generated/probe-sessions.json | tee /tmp/measure.txt
          { echo; echo "### CPU measurement (milliseconds of Worker CPU, from wrangler tail)"; echo; echo '```'; cat /tmp/measure.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the throwaway Neon Auth users, sessions and probe leads
        if: always()
        env:
          DATABASE_URL: ${{ secrets.PHASE0_MIGRATION_DATABASE_URL }}
        run: node scripts/ci/seed-probe-sessions.mjs --cleanup

      - name: Save the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-reports
          path: |
            scripts/.generated/measurements-*.json
            scripts/.generated/stage0-probes-*.json
            scripts/.generated/*.log
          # The reports live in a hidden folder (scripts/.generated), which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
